<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Clearance - E-Clearance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            font-family: Arial, sans-serif;
        }

        .container-box {
            max-width: 750px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .page-title {
            color: #263b80;
            font-weight: bold;
        }

        .info-box {
            background: #eef3ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .btn-apply {
            background: #263b80;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
        }

        .btn-apply:hover {
            background: #192b65;
            color: white;
        }
    </style>
</head>

<body>

<div class="container-box">

    <h2 class="page-title">Apply for Clearance</h2>

    <p class="text-muted">
        Submit your college clearance application.
    </p>

    <hr>

    <div class="info-box">

        <h5>Student Information</h5>

        <p>
            <strong>Name:</strong>
            <span th:text="${student.user.name}"></span>
        </p>

        <p>
            <strong>Roll Number:</strong>
            <span th:text="${student.rollNumber}"></span>
        </p>

        <p>
            <strong>Course:</strong>
            <span th:text="${student.course}"></span>
        </p>

        <p>
            <strong>Branch:</strong>
            <span th:text="${student.branch}"></span>
        </p>

    </div>

    <div class="alert alert-info mt-4">
        After submitting your application, your clearance request
        will be forwarded to all available clearance authorities.
    </div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <form th:action="@{/apply-clearance}" method="post">

        <div class="form-check mb-4">
            <input class="form-check-input"
                   type="checkbox"
                   id="confirmation"
                   required>

            <label class="form-check-label" for="confirmation">
                I confirm that the student information displayed above
                is correct and I want to submit my clearance application.
            </label>
        </div>

        <button type="submit" class="btn btn-apply">
            Submit Application
        </button>

        <a th:href="@{/student-dashboard}"
           class="btn btn-outline-secondary ms-2">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
